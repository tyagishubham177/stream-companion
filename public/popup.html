<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Stream Companion</title><link rel="stylesheet" href="pages.css"><script src="popup.js" defer></script></head>
<body class="popup-page">
  <main class="popup-shell">
    <header class="brand"><span class="brand-mark" aria-hidden="true">S<span>·</span></span><div><p class="eyebrow">NETFLIX · JIOHOTSTAR</p><h1>Stream Companion</h1></div></header>
    <section aria-label="Browsing features">
      <p id="features-paused" class="small amber" hidden>Browsing tools are paused in Advanced settings.</p>
      <label class="feature-setting"><span><strong id="ratings-label">IMDb ratings</strong><span id="ratings-description" class="small muted">Scores on supported titles</span></span><span class="switch"><input id="ratingsEnabled" type="checkbox" role="switch" aria-labelledby="ratings-label" aria-describedby="ratings-description" disabled><span class="switch-track" aria-hidden="true"></span></span></label>
      <label class="feature-setting"><span><strong id="marks-label">Mark as watched</strong><span id="marks-description" class="small muted">Watched, Want to watch and Won’t watch</span></span><span class="switch"><input id="marksEnabled" type="checkbox" role="switch" aria-labelledby="marks-label" aria-describedby="marks-description" disabled><span class="switch-track" aria-hidden="true"></span></span></label>
    </section>
    <section class="popup-section" aria-labelledby="page-heading"><div class="row"><h2 id="page-heading">This tab</h2><span id="page-status" class="tag">Connecting</span></div><p id="page-message" class="muted">Checking for a supported streaming page…</p><dl class="stats" id="page-stats" hidden><div><dt>Rated</dt><dd id="rated">—</dd></div><div><dt>Stale cached</dt><dd id="cached">—</dd></div><div><dt>Unresolved</dt><dd id="unresolved">—</dd></div></dl></section>
    <details class="popup-section popup-details"><summary>Rating service</summary><p id="provider" class="muted">Checking provider…</p><p id="usage" class="small muted"></p><p id="cache-mode" class="small amber" hidden>Cache only is on. New lookups are paused.</p></details>
    <p id="notice" class="notice" role="status" aria-live="polite"></p>
    <footer class="row popup-footer"><a href="titles.html" target="_blank" rel="noopener">Your titles →</a><button id="settings" class="text-button" type="button">Settings <span aria-hidden="true">↗</span></button></footer>
  </main>
</body></html>
